name: CodeQL

# Full CodeQL analysis of the C code (security-extended + quality query suites).
# Serialized with the CI workflow (same concurrency group): one job per runner architecture at a time.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: carrom-ci
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build (Debug, every target including the tests)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
