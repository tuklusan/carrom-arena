name: macOS Diag

# Scratch workflow for iterating on the macOS screenshot-capture crash without paying for
# the full release.yml matrix each time. Not wired into any release; safe to delete once
# the fix lands in release.yml's own macOS capture step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. beta-0.0.15)"
        required: true
      runner:
        description: "Single macOS runner label to test"
        required: true
        default: macos-15

jobs:
  diag:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - run: python3 build/build.py --build-type Release --no-test
        shell: bash
      - name: Try a real screenshot with the HiDPI bypass
        shell: bash --noprofile --norc -uo pipefail {0}
        env:
          CARROM_CI_SCREENSHOT: "1"
        run: |
          bin=$(ls out/dist/* | head -1)
          chmod +x "$bin"
          echo "DIAG: bin=$bin"
          "$bin" --seed=1 --no-radio > game-stdout.log 2> game-stderr.log &
          GPID=$!
          sleep 15
          if kill -0 $GPID 2>/dev/null; then
            echo "DIAG: still running (pid $GPID) - good sign"
          else
            wait $GPID
            echo "DIAG: exited early, code $?"
          fi
          echo "DIAG: --- stdout ---"; cat game-stdout.log
          echo "DIAG: --- stderr ---"; cat game-stderr.log
          screencapture -x screenshot.png || echo "DIAG: screencapture failed"
          kill $GPID 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diag-${{ inputs.runner }}
          path: |
            screenshot.png
            game-stdout.log
            game-stderr.log
          if-no-files-found: warn
          retention-days: 3
