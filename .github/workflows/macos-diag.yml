name: macOS Diag

# Scratch workflow for iterating on the macOS screenshot-capture crash without paying for
# the full release.yml matrix each time. Not wired into any release; safe to delete once
# the fix lands in release.yml's own macOS capture step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. beta-0.0.15)"
        required: true
      runner:
        description: "Single macOS runner label to test"
        required: true
        default: macos-15

jobs:
  diag:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - run: python3 build/build.py --build-type Release --no-test
        shell: bash
      - name: Enable Developer Mode
        run: sudo /usr/sbin/DevToolsSecurity -enable
        shell: bash
      - name: Run and collect the macOS crash report
        shell: bash --noprofile --norc -uo pipefail {0}
        env:
          CARROM_CI_SCREENSHOT: "1"
        run: |
          rm -f ~/Library/Logs/DiagnosticReports/carrom_arena*.crash
          bin=$(ls out/dist/* | head -1)
          chmod +x "$bin"
          echo "DIAG: bin=$bin"
          "$bin" --seed=1 --no-radio || true
          sleep 5
          echo "DIAG: --- crash reports ---"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>&1
          report=$(ls -t ~/Library/Logs/DiagnosticReports/carrom_arena*.crash 2>/dev/null | head -1)
          if [ -n "$report" ]; then
            echo "DIAG: found $report"
            cp "$report" crash-report.crash
            grep -A15 "Thread 0 Crashed" "$report"
          else
            echo "DIAG: no crash report found"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diag-${{ inputs.runner }}
          path: |
            crash-report.crash
          if-no-files-found: warn
          retention-days: 3
