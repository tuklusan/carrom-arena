name: Release

# Manual, on-demand: build zipped executables for every supported platform (build/build.py's canonical RUNNERS),
# publish them to a GitHub Release on an existing tag, then run an extra screenshot-only matrix across a much wider
# catalog of GitHub-hosted runner images (release builds only, never the normal push/PR CI) purely to capture
# proof-of-life screenshots for the README. A screenshot runner failing (deprecated/preview/exotic image) does not
# fail the release; the release artifacts come only from the 6 canonical runners.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. beta-0.0.15)"
        required: true

permissions:
  contents: write
  actions: read

# At most one release run at a time (queue size 1): a second dispatch is rejected outright
# (not queued) if another run is already active, mirroring ci.yml's admit/reject gate. Queuing
# was tried first but a queued second run's own git operations raced the first run's
# commit-screenshots push, so reject-fast is used instead.
jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - name: Reject if another release run is already active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          active=$(gh run list --repo "${{ github.repository }}" --workflow=release.yml \
            --json databaseId,status --jq \
            '[.[] | select(.databaseId != ${{ github.run_id }} and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested"))] | length')
          if [ "$active" -gt 0 ]; then
            echo "::error::Another release workflow run is already active; rejecting this trigger (queue size 1)."
            exit 1
          fi

  build:
    name: build (${{ matrix.runner }})
    needs: admit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - run: $(command -v python3 || command -v python) build/build.py --build-type Release
        shell: bash
      - name: Zip the release binary (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          cd out/dist
          bin=$(ls)
          zip -j "../../carrom-arena-${{ inputs.tag }}-${{ matrix.runner }}.zip" "$bin" ../../LICENSE ../../README.md
      - name: Zip the release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = (Get-ChildItem out/dist/*.exe | Select-Object -First 1).FullName
          Compress-Archive -Path $bin, LICENSE, README.md -DestinationPath "carrom-arena-${{ inputs.tag }}-${{ matrix.runner }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip-${{ matrix.runner }}
          path: carrom-arena-${{ inputs.tag }}-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-zip-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" dist/*.zip --clobber
          else
            gh release create "${{ inputs.tag }}" dist/*.zip \
              --title "${{ inputs.tag }}" \
              --notes "Automated release build. See RESUME.md and the dev blog for details."
          fi

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download and sanity-check the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          rm -rf verify && mkdir verify && cd verify
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}"
          fail=0
          for z in *.zip; do
            if unzip -l "$z" | grep -qi 'carrom_arena'; then
              echo "OK   $z"
            else
              echo "FAIL $z (no carrom_arena binary inside)"
              fail=1
            fi
          done
          test "$fail" -eq 0

  screenshots:
    name: screenshot (${{ matrix.runner }})
    needs: build
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04,           seed: 101 }
          - { runner: ubuntu-26.04-arm,       seed: 102 }
          - { runner: ubuntu-24.04,           seed: 103 }
          - { runner: ubuntu-24.04-arm,       seed: 104 }
          - { runner: ubuntu-22.04,           seed: 105 }
          - { runner: ubuntu-22.04-arm,       seed: 106 }
          - { runner: ubuntu-slim,            seed: 107 }
          - { runner: windows-2025,           seed: 108 }
          - { runner: windows-2025-vs2026,    seed: 109 }
          - { runner: windows-2022,           seed: 110 }
          - { runner: macos-26,               seed: 113 }
          - { runner: macos-26-intel,         seed: 114 }
          - { runner: macos-15,               seed: 115 }
          - { runner: macos-15-intel,         seed: 116 }
          - { runner: macos-14,               seed: 117 }
          - { runner: xcode-27,               seed: 118 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - run: $(command -v python3 || command -v python) build/build.py --build-type Release --no-test
        shell: bash
      - name: Capture a screenshot (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick xvfb || true
          bin=$(ls out/dist/* | head -1)
          chmod +x "$bin"
          Xvfb :95 -screen 0 800x600x24 >/dev/null 2>&1 &
          sleep 1
          DISPLAY=:95 "$bin" --seed=${{ matrix.seed }} --no-radio >/dev/null 2>&1 &
          GPID=$!
          sleep 15
          DISPLAY=:95 import -window root "screenshot-${{ matrix.runner }}.png"
          kill $GPID 2>/dev/null || true
      - name: Capture a screenshot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CARROM_CI_SCREENSHOT: "1"
        run: |
          set -u
          bin=$(ls out/dist/* | head -1)
          chmod +x "$bin"
          "$bin" --seed=${{ matrix.seed }} --no-radio > game-stdout.log 2> game-stderr.log &
          GPID=$!
          sleep 15
          if kill -0 $GPID 2>/dev/null; then
            echo "DIAG: game process still running (pid $GPID)"
          else
            wait $GPID
            echo "DIAG: game process exited early, code $?"
          fi
          echo "DIAG: --- stdout ---"; cat game-stdout.log
          echo "DIAG: --- stderr ---"; cat game-stderr.log
          screencapture -x "screenshot-${{ matrix.runner }}.png" || echo "DIAG: screencapture failed"
          kill $GPID 2>/dev/null || true
      - name: Install Mesa software OpenGL (Windows x64 only; headless runners have no GPU driver)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          $bin = (Get-ChildItem out/dist/*.exe | Select-Object -First 1).FullName
          $binDir = Split-Path $bin -Parent
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.3/mesa3d-26.2.3-release-msvc.7z" -OutFile mesa.7z
          & "C:\Program Files\7-Zip\7z.exe" x mesa.7z -omesa -y | Out-Null
          $dllDir = (Get-ChildItem -Path mesa -Filter opengl32.dll -Recurse | Where-Object { $_.DirectoryName -match '\\x64($|\\)' } | Select-Object -First 1).DirectoryName
          if (-not $dllDir) { throw "Mesa x64 opengl32.dll not found in archive" }
          Copy-Item (Join-Path $dllDir '*.dll') -Destination $binDir -Force
      - name: Capture a screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $bin = (Get-ChildItem out/dist/*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $bin -ArgumentList "--seed=${{ matrix.seed }} --no-radio" -RedirectStandardOutput game-stdout.log -RedirectStandardError game-stderr.log -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "DIAG: game process exited early, code $($p.ExitCode)"
          } else {
            Write-Host "DIAG: game process still running after 15s (pid $($p.Id))"
          }
          Write-Host "DIAG: --- stdout ---"
          Get-Content game-stdout.log -ErrorAction SilentlyContinue
          Write-Host "DIAG: --- stderr ---"
          Get-Content game-stderr.log -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.CopyFromScreen(0, 0, 0, 0, $b.Size)
          $b.Save("screenshot-${{ matrix.runner }}.png")
          Get-Process -Name carrom_arena* | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshot-${{ matrix.runner }}
          path: screenshot-${{ matrix.runner }}.png
          if-no-files-found: warn
          retention-days: 7

  commit-screenshots:
    needs: [admit, screenshots]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: screenshot-*
          path: docs/screenshots
          merge-multiple: true
        continue-on-error: true
      - name: Commit whichever screenshots came through
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/screenshots
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh runner screenshots (${{ inputs.tag }})"
            git push origin main
          else
            echo "no screenshots changed"
          fi
