# Carrom Arena CI - 18-Runner Cross-Platform Matrix
name: Carrom Arena CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Common CMake options
  CMAKE_GENERATOR: "Ninja"

jobs:
  build-test:
    name: ${{ matrix.os }}/${{ matrix.compiler }}/${{ matrix.build_type }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 - GCC (Debug + Release)
          - os: "ubuntu-24.04"
            runs-on: "ubuntu-24.04"
            compiler: "gcc"
            cc: "gcc"
            cxx: "g++"
            build_type: "Debug"
            cmake_extra: ""
          
          - os: "ubuntu-24.04"
            runs-on: "ubuntu-24.04"
            compiler: "gcc"
            cc: "gcc"
            cxx: "g++"
            build_type: "Release"
            cmake_extra: ""
          
          # Ubuntu 24.04 - Clang (Debug + Release)
          - os: "ubuntu-24.04"
            runs-on: "ubuntu-24.04"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Debug"
            cmake_extra: ""
          
          - os: "ubuntu-24.04"
            runs-on: "ubuntu-24.04"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Release"
            cmake_extra: ""
          
          # Ubuntu 22.04 - GCC (Debug + Release)
          - os: "ubuntu-22.04"
            runs-on: "ubuntu-22.04"
            compiler: "gcc"
            cc: "gcc"
            cxx: "g++"
            build_type: "Debug"
            cmake_extra: ""
          
          - os: "ubuntu-22.04"
            runs-on: "ubuntu-22.04"
            compiler: "gcc"
            cc: "gcc"
            cxx: "g++"
            build_type: "Release"
            cmake_extra: ""
          
          # Ubuntu 22.04 - Clang (Debug + Release)
          - os: "ubuntu-22.04"
            runs-on: "ubuntu-22.04"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Debug"
            cmake_extra: ""
          
          - os: "ubuntu-22.04"
            runs-on: "ubuntu-22.04"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Release"
            cmake_extra: ""
          
          # macOS 14 - Clang (Debug + Release)
          - os: "macos-14"
            runs-on: "macos-14"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Debug"
            cmake_extra: ""
          
          - os: "macos-14"
            runs-on: "macos-14"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Release"
            cmake_extra: ""
          
          # macOS 13 - Clang (Debug)
          - os: "macos-13"
            runs-on: "macos-13"
            compiler: "clang"
            cc: "clang"
            cxx: "clang++"
            build_type: "Debug"
            cmake_extra: ""
          
          # Windows 2022 - MSVC (Debug + Release)
          - os: "windows-2022"
            runs-on: "windows-2022"
            compiler: "msvc"
            cc: "cl"
            cxx: "cl"
            build_type: "Debug"
            cmake_extra: ""
            shell: cmd
          
          - os: "windows-2022"
            runs-on: "windows-2022"
            compiler: "msvc"
            cc: "cl"
            cxx: "cl"
            build_type: "Release"
            cmake_extra: ""
            shell: cmd
          
          # Windows 2022 - MinGW (Debug + Release)
          - os: "windows-2022"
            runs-on: "windows-2022"
            compiler: "mingw"
            cc: "x86_64-w64-mingw32-gcc"
            cxx: "x86_64-w64-mingw32-g++"
            build_type: "Debug"
            cmake_extra: "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++"
            shell: cmd
          
          - os: "windows-2022"
            runs-on: "windows-2022"
            compiler: "mingw"
            cc: "x86_64-w64-mingw32-gcc"
            cxx: "x86_64-w64-mingw32-g++"
            build_type: "Release"
            cmake_extra: "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++"
            shell: cmd
          
          # Windows 2019 - MSVC (Debug + Release)
          - os: "windows-2019"
            runs-on: "windows-2019"
            compiler: "msvc"
            cc: "cl"
            cxx: "cl"
            build_type: "Debug"
            cmake_extra: ""
            shell: cmd
          
          - os: "windows-2019"
            runs-on: "windows-2019"
            compiler: "msvc"
            cc: "cl"
            cxx: "cl"
            build_type: "Release"
            cmake_extra: ""
            shell: cmd
          
          # Windows 2019 - MinGW (Debug + Release)
          - os: "windows-2019"
            runs-on: "windows-2019"
            compiler: "mingw"
            cc: "x86_64-w64-mingw32-gcc"
            cxx: "x86_64-w64-mingw32-g++"
            build_type: "Debug"
            cmake_extra: "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++"
            shell: cmd
          
          - os: "windows-2019"
            runs-on: "windows-2019"
            compiler: "mingw"
            cc: "x86_64-w64-mingw32-gcc"
            cxx: "x86_64-w64-mingw32-g++"
            build_type: "Release"
            cmake_extra: "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++"
            shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux dependency installation
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ clang libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev

      # macOS dependency installation (cmake, ninja, and Xcode tools are pre-installed)
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja

      # Windows MSVC: ensure VS environment (already set up on windows runners)
      - name: Setup MSVC environment
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows MinGW: install mingw-w64
      - name: Install MinGW on Windows
        if: runner.os == 'Windows' && matrix.compiler == 'mingw'
        shell: pwsh
        run: |
          choco install mingw --version 13.1.0 -y --no-progress
          echo "C:\Program Files\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: ${{ matrix.shell || 'bash' }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -G "${{ env.CMAKE_GENERATOR }}" \
            ${{ matrix.cmake_extra }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        shell: ${{ matrix.shell || 'bash' }}
        run: cmake --build build --parallel 4

      - name: Run tests (headless)
        shell: ${{ matrix.shell || 'bash' }}
        run: |
          cd build && ctest --output-on-failure --parallel 4
        env:
          # Ensure headless mode for any test that might try to open a window
          CARROM_HEADLESS: "1"

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/Testing/**/*.xml
            build/Testing/**/*.log
          retention-days: 7

  # Summary job to report overall status
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: build-test
    if: always()
    steps:
      - name: Report matrix status
        run: |
          echo "=== 18-Runner Matrix Results ==="
          echo "Job results from needs.build-test:"
          for job in ${{ join(needs.build-test.result, ', ') }}; do
            echo "  $job"
          done
          # Check if any failed
          if [[ "${{ needs.build-test.result }}" == "failure" ]]; then
            echo "::error::One or more matrix jobs failed"
            exit 1
          fi
          echo "All 18 runners PASSED ✅"