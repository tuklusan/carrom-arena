name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - Ubuntu 24.04
          - os: ubuntu-24.04
            compiler: gcc
            build_type: Release
            cmake_extra_args: ""
          - os: ubuntu-24.04
            compiler: clang
            build_type: Release
            cmake_extra_args: "-DCMAKE_C_COMPILER=clang"
          - os: ubuntu-24.04
            compiler: gcc
            build_type: Debug
            cmake_extra_args: "-DCMAKE_BUILD_TYPE=Debug"
          - os: ubuntu-24.04
            compiler: clang
            build_type: Debug
            cmake_extra_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug"
          
          # Linux - Ubuntu 22.04
          - os: ubuntu-22.04
            compiler: gcc
            build_type: Release
            cmake_extra_args: ""
          - os: ubuntu-22.04
            compiler: clang
            build_type: Release
            cmake_extra_args: "-DCMAKE_C_COMPILER=clang"
          - os: ubuntu-22.04
            compiler: gcc
            build_type: Debug
            cmake_extra_args: "-DCMAKE_BUILD_TYPE=Debug"
          - os: ubuntu-22.04
            compiler: clang
            build_type: Debug
            cmake_extra_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug"
          
          # macOS 14 (Sonoma)
          - os: macos-14
            compiler: clang
            build_type: Release
            cmake_extra_args: ""
          - os: macos-14
            compiler: clang
            build_type: Debug
            cmake_extra_args: "-DCMAKE_BUILD_TYPE=Debug"
          
          # macOS 13 (Ventura)
          - os: macos-13
            compiler: clang
            build_type: Release
            cmake_extra_args: ""
          - os: macos-13
            compiler: clang
            build_type: Debug
            cmake_extra_args: "-DCMAKE_BUILD_TYPE=Debug"
          
          # Windows 2022 - MinGW only (MSVC temporarily disabled - fix pending)
          - os: windows-2022
            compiler: mingw
            build_type: Release
            cmake_extra_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
          - os: windows-2022
            compiler: mingw
            build_type: Debug
            cmake_extra_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug"
          
          # Windows 2019 - MinGW only (MSVC temporarily disabled - fix pending)
          - os: windows-2019
            compiler: mingw
            build_type: Release
            cmake_extra_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++"
          - os: windows-2019
            compiler: mingw
            build_type: Debug
            cmake_extra_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      - name: Setup MSVC environment
        if: matrix.compiler == 'msvc' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja ${{ matrix.cmake_extra_args }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} -j

      - name: Run ctest
        run: |
          ctest --test-dir build --output-on-failure -j$(nproc)
        shell: bash

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build/Testing/**/*.xml
          retention-days: 7

