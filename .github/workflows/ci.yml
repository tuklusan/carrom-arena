name: CI

# All logic lives in build/build.py (run it by hand for a manual build). This file only picks runners and calls it.
# admit: the queue gate. It takes one of two tickets per runner kind (atomic git-ref creation, see build/build.py); no ticket
# means the queue for that kind is full (one running, one waiting) and the run is rejected. At most one job per runner kind runs
# (concurrency group below); the ticket is given back by the last step of the build job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  admit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      runners: ${{ steps.gate.outputs.runners }}
      rejected: ${{ steps.gate.outputs.rejected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: gate
        run: python3 build/build.py admit
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: build (${{ matrix.runner }})
    needs: admit
    if: ${{ always() && needs.admit.outputs.runners != '' && needs.admit.outputs.runners != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    concurrency:
      group: carrom-${{ matrix.runner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.admit.outputs.runners) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # tags too, so the build id is the release tag when there is one
      - run: $(command -v python3 || command -v python) build/build.py --build-type Debug,Release
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carrom-arena-${{ matrix.runner }}
          path: out/dist/*
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: $(command -v python3 || command -v python) build/build.py release --kind ${{ matrix.runner }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  verdict:
    needs: [admit, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.admit.result }}" = success && test -z "${{ needs.admit.outputs.rejected }}" || { echo "queue full or gate error, rejected - ${{ needs.admit.outputs.rejected }}"; exit 1; }
