name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one CI run at a time, and inside a run only ONE job per runner
# architecture at a time (max-parallel: 1 per architecture job below).
concurrency:
  group: carrom-ci
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc,   build_type: Release, cmake_extra_args: "" }
          - { os: ubuntu-24.04, compiler: clang, build_type: Release, cmake_extra_args: "-DCMAKE_C_COMPILER=clang" }
          - { os: ubuntu-24.04, compiler: gcc,   build_type: Debug,   cmake_extra_args: "" }
          - { os: ubuntu-24.04, compiler: clang, build_type: Debug,   cmake_extra_args: "-DCMAKE_C_COMPILER=clang" }
          - { os: ubuntu-22.04, compiler: gcc,   build_type: Release, cmake_extra_args: "" }
          - { os: ubuntu-22.04, compiler: clang, build_type: Release, cmake_extra_args: "-DCMAKE_C_COMPILER=clang" }
          - { os: ubuntu-22.04, compiler: gcc,   build_type: Debug,   cmake_extra_args: "" }
          - { os: ubuntu-22.04, compiler: clang, build_type: Debug,   cmake_extra_args: "-DCMAKE_C_COMPILER=clang" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-cell
        with:
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          cmake_extra_args: ${{ matrix.cmake_extra_args }}
          artifact_suffix: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}

  windows:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: windows-2022, compiler: mingw, build_type: Release, cmake_extra_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
          - { os: windows-2022, compiler: mingw, build_type: Debug,   cmake_extra_args: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-cell
        with:
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          cmake_extra_args: ${{ matrix.cmake_extra_args }}
          artifact_suffix: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
