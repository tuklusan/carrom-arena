<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #canvas {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    display: block;
    outline: none;
  }
  #status {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ccc;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    pointer-events: none;
  }
  /* Click/tap-to-start on every browser, desktop and phone alike - the browser's audio autoplay
     policy needs one real user gesture before sound can play, and this fully autonomous game
     never otherwise asks for one. The wasm module loads and fully initializes (Module.noInitialRun)
     but main() - and everything it calls, including InitWindow/InitAudioDevice and the game loop
     itself - does not run until this overlay is clicked, so the click is a genuine synchronous user
     gesture the browser will honour for audio, and nothing is visibly happening behind the overlay
     before that click. */
  #startOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }
  #startOverlay.ready {
    display: flex;
  }
  #startOverlay .line1, #startOverlay .line2 {
    font-size: 18px;
    font-weight: 400;
    color: #ddd;
  }
  #startOverlay .line2 {
    margin-bottom: 18px;
  }
  #startOverlay .tap {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading...</div>
  <div id="startOverlay">
    <div>
      <div class="line1">SANYALnet Labs</div>
      <div class="line2">Carrom Arena</div>
      <div class="tap">CLICK TO PLAY</div>
    </div>
  </div>
  <script>
    var statusElement = document.getElementById('status');
    var overlayElement = document.getElementById('startOverlay');
    var Module = {
      canvas: document.getElementById('canvas'),
      noInitialRun: true,   /* wait for a real click before main() runs, on every browser */
      setStatus: function (text) {
        statusElement.textContent = text;
        if (!text) {
          statusElement.style.display = 'none';
          overlayElement.classList.add('ready');
        }
      }
    };
    /* Best-effort mobile Web Audio unlock: some mobile browsers (notably iOS Safari) require Web
       Audio to actually be exercised - not just some code invoked - synchronously within the
       gesture, beyond the general "was there a user gesture" check. A throwaway silent buffer
       played here, before main() ever touches audio, primes that regardless of what miniaudio
       does internally afterward. Harmless on desktop too. */
    function unlockAudio() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var buffer = ctx.createBuffer(1, 1, 22050);
        var source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        if (ctx.resume) ctx.resume();
      } catch (e) {}
    }
    overlayElement.addEventListener('click', function () {
      overlayElement.style.display = 'none';
      unlockAudio();
      Module.callMain();
    });
  </script>
  {{{ SCRIPT }}}
</body>
